<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>为什么</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="explain-page">

        <h1 id="question">
            加载中……
        </h1>


        <div id="explanation">

            <div class="loading">
                解释生成中……
            </div>

        </div>


        <button id="detailButton">
            详细解释
        </button>

        <button id="backButton">
            返回
        </button>

    </main>


    <script>

        const questionElement =
            document.getElementById(
                "question"
            );


        const explanationElement =
            document.getElementById(
                "explanation"
            );


        const backButton =
            document.getElementById(
                "backButton"
            );

        const detailButton =
            document.getElementById(
                "detailButton"
            );


        const params =
            new URLSearchParams(
                window.location.search
            );


        const question =
            params.get("question");


        if (!question) {

            questionElement.textContent =
                "没有找到问题";

            explanationElement.innerHTML =
                `
                <div class="error">
                    请返回上一页重新生成。
                </div>
                `;

        } else {

            questionElement.textContent =
                question;

            generateExplanation(
                question
            );
        }



        async function generateExplanation(
            question
        ) {

            try {

                const response =
                    await fetch(
                        "https://why-api.cgfe10231.workers.dev/api/explain",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                question:
                                    question
                            })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "解释生成失败"
                    );
                }


                const data =
                    await response.json();


                if (
                    !data.explanation
                ) {

                    throw new Error(
                        "没有收到解释"
                    );
                }


                renderExplanation(
                    data.explanation
                );


            } catch (error) {

                console.error(error);

                explanationElement.innerHTML =
                    `
                    <div class="error">
                        解释生成失败，请返回后重试。
                    </div>
                    `;
            }
        }



        function renderExplanation(
            explanation
        ) {

            explanationElement.innerHTML =
                "";


            // 核心回答

            const summary =
                document.createElement(
                    "div"
                );

            summary.className =
                "explanation-summary";

            summary.textContent =
                explanation.summary;

            explanationElement.appendChild(
                summary
            );


            // 分点

            explanation.points.forEach(
                (point, index) => {

                    const block =
                        document.createElement(
                            "section"
                        );

                    block.className =
                        "explanation-point";


                    const title =
                        document.createElement(
                            "h2"
                        );

                    title.textContent =
                        `${index + 1}. ${point.title}`;


                    const content =
                        document.createElement(
                            "p"
                        );

                    content.textContent =
                        point.content;


                    block.appendChild(
                        title
                    );

                    block.appendChild(
                        content
                    );


                    explanationElement.appendChild(
                        block
                    );
                }
            );


            // 总结

            const conclusion =
                document.createElement(
                    "div"
                );

            conclusion.className =
                "explanation-conclusion";

            conclusion.textContent =
                explanation.conclusion;


            explanationElement.appendChild(
                conclusion
            );
        }



        detailButton.addEventListener(
    "click",
    () => {

        window.location.href =
            "detail.html?question=" +
            encodeURIComponent(
                question
            );

    }
);

    </script>

</body>

</html>
