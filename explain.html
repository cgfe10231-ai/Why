<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解释</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="explain-page">

        <h1 id="questionTitle"></h1>

        <p id="answer"></p>

        <button onclick="history.back()">返回</button>

    </main>

    <script>
        const whyList = [
            {
                question: "为什么天空是蓝色的？",
                answer: "因为太阳光进入大气层后，会被空气分子散射。其中短波长的蓝光比红光更容易被散射，所以从地面看，天空大部分时候呈现蓝色。"
            },
            {
                question: "为什么人会打哈欠？",
                answer: "打哈欠与大脑觉醒状态、睡眠和疲劳等因素有关。人在困倦或状态切换时，更容易出现打哈欠。它并不是单纯因为缺氧。"
            },
            {
                question: "为什么冰会浮在水面上？",
                answer: "因为水结冰时，分子排列形成较为疏松的晶体结构，体积增大，因此冰的密度小于液态水，所以会浮在水面上。"
            },
            {
                question: "为什么人睡觉时会做梦？",
                answer: "做梦主要发生在睡眠过程中，尤其常见于快速眼动睡眠。大脑在睡眠时并没有完全停止活动，记忆、情绪和感觉信息仍会被重新处理，因此会形成梦境体验。"
            }
        ];

        const params = new URLSearchParams(window.location.search);
        const question = params.get("question");

        const result = whyList.find(
            item => item.question === question
        );

        document.getElementById("questionTitle").textContent =
            result ? result.question : "没有找到这个问题";

        document.getElementById("answer").textContent =
            result ? result.answer : "暂时没有对应的解释。";
    </script>

</body>
</html>
