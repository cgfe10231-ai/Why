<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>为什么 - 解释</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="why-page">

        <h1 id="explainQuestion">正在加载问题……</h1>

        <div id="explainContent">
            正在生成解释……
        </div>

        <button id="detailButton">
            详细解释
        </button>

        <button id="backButton">
            返回
        </button>

    </main>

    <script>
        const API_BASE =
            "https://why-api.cgfe10231.workers.dev";

        const explainQuestion =
            document.getElementById("explainQuestion");

        const explainContent =
            document.getElementById("explainContent");

        const detailButton =
            document.getElementById("detailButton");

        const backButton =
            document.getElementById("backButton");


        /*
         * 当前问题的唯一来源：
         *
         * 第一优先级：
         * explain.html?question=xxxx
         *
         * 第二优先级：
         * sessionStorage
         *
         * 这样即使从 detail 返回，
         * explain 也不会因为内存状态丢失而变空。
         */

        function getCurrentQuestion() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const urlQuestion =
                params.get("question");

            if (urlQuestion) {

                sessionStorage.setItem(
                    "whyQuestion",
                    urlQuestion
                );

                return urlQuestion;
            }

            const savedQuestion =
                sessionStorage.getItem(
                    "whyQuestion"
                );

            return savedQuestion || "";
        }


        function showError(message) {

            explainContent.textContent =
                message;

            detailButton.style.display =
                "none";
        }


        async function loadExplanation() {

            const question =
                getCurrentQuestion();

            if (!question) {

                explainQuestion.textContent =
                    "没有找到问题";

                showError(
                    "无法打开解释：当前页面没有找到问题。"
                );

                return;
            }


            explainQuestion.textContent =
                question;

            explainContent.textContent =
                "正在生成解释……";


            try {

                const response =
                    await fetch(
                        API_BASE + "/api/explain",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                question: question
                            })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "解释生成失败"
                    );
                }


                const data =
                    await response.json();


                if (!data.explanation) {

                    throw new Error(
                        "服务器没有返回解释"
                    );
                }


                explainContent.textContent =
                    data.explanation;


                /*
                 * 进入详细解释时，
                 * 不使用 history，
                 * 直接把当前问题写进 URL。
                 */

                detailButton.style.display =
                    "block";

                detailButton.onclick =
                    () => {

                        window.location.href =
                            "detail.html?question=" +
                            encodeURIComponent(
                                question
                            );
                    };

            } catch (error) {

                console.error(error);

                showError(
                    "生成解释失败，请再试一次。"
                );
            }
        }


        /*
         * 解释页永远明确回首页。
         *
         * 不再使用 history.back()
         */

        backButton.onclick =
            () => {

                window.location.href =
                    "index.html";
            };


        loadExplanation();
    </script>

</body>

</html>
