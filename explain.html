<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>为什么</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="why-page">

        <h1 id="question"></h1>

        <div id="explanation">
            解释生成中……
        </div>

        <button id="backButton">
            返回
        </button>

    </main>

    <script>

        const questionElement =
            document.getElementById("question");

        const explanationElement =
            document.getElementById("explanation");

        const backButton =
            document.getElementById("backButton");


        const params =
            new URLSearchParams(window.location.search);

        const question =
            params.get("question");


        if (!question) {

            questionElement.textContent =
                "没有找到问题";

            explanationElement.textContent =
                "请返回上一页重新生成。";

        } else {

            questionElement.textContent =
                question;

            generateExplanation(question);
        }


        async function generateExplanation(question) {

            try {

                const response = await fetch(
                    "https://why-api.cgfe10231.workers.dev/api/explain",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            question: question
                        })
                    }
                );


                if (!response.ok) {
                    throw new Error(
                        "服务器返回错误"
                    );
                }


                const data =
                    await response.json();


                if (!data.explanation) {
                    throw new Error(
                        "没有收到解释"
                    );
                }


                explanationElement.textContent =
                    data.explanation;


            } catch (error) {

                console.error(error);

                explanationElement.textContent =
                    "解释生成失败，请返回后重试。";
            }
        }


        backButton.addEventListener(
            "click",
            () => {
                window.history.back();
            }
        );

    </script>

</body>

</html>
